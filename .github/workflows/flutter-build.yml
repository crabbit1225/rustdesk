name: Flutter Build Windows EXE

on:
  workflow_call:
    inputs:
      build-platforms:
        required: true
        type: string
      upload-artifact:
        required: false
        type: boolean
        default: true
      version:
        required: false
        type: string

jobs:
  build-windows:
    if: ${{ inputs.build-platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Disable Android/iOS bridge generation
        run: |
          echo "FLUTTER_RUST_BRIDGE_SKIP_ANDROID=true" >> $env:GITHUB_ENV
          echo "FLUTTER_RUST_BRIDGE_SKIP_IOS=true" >> $env:GITHUB_ENV

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Windows App
        run: flutter build windows --release

      - name: Build Rust Backend
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package EXE
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrEmpty($version)) {
              # 自动从 Cargo.toml 获取版本
              $version = (Get-Content Cargo.toml | Select-String 'version *= *"(.*)"').Matches[0].Groups[1].Value
          }
          Write-Host "Building RustDesk Windows EXE version $version"
          $outDir = "output"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item -Force target\x86_64-pc-windows-msvc\release\rustdesk.exe "$outDir\rustdesk-windows-$version.exe"

      - name: Upload artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: output/rustdesk-windows-*.exe
